name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.toolchain }} (Release)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msvc, mingw]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK (for csharp-ls E2E test)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install csharp-ls and restore sample project
        shell: pwsh
        run: |
          dotnet tool install -g csharp-ls
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          dotnet build examples/csharp_sample/Sample.csproj

      - name: Setup MSVC (vcvars64)
        if: matrix.toolchain == 'msvc'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio with C++ x64 tools not found" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          $origPaths = ($env:PATH -split ';') | ForEach-Object { $_.TrimEnd('\').ToLowerInvariant() }
          $envDump = & cmd.exe /c "`"$vcvars`" >nul && set"
          foreach ($line in $envDump) {
            $idx = $line.IndexOf('=')
            if ($idx -le 0) { continue }
            $name = $line.Substring(0, $idx)
            $val = $line.Substring($idx + 1)
            if ($name -ieq "PATH") {
              $newPaths = ($val -split ';') | Where-Object { $_ -and ($origPaths -notcontains $_.TrimEnd('\').ToLowerInvariant()) }
              $newPaths | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } elseif ($name -match '^(INCLUDE|LIB|LIBPATH|VC|WindowsSDK|UniversalCRTSdk|UCRT|VCTools|DevEnv|Framework|EXTERNAL_INCLUDE)') {
              "$name=$val" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: Setup MinGW-w64 (niXman win32-seh-msvcrt) & Ninja
        if: matrix.toolchain == 'mingw'
        shell: pwsh
        run: |
          $url = "https://github.com/niXman/mingw-builds-binaries/releases/download/16.2.0-rt_v14-rev1/x86_64-16.2.0-release-win32-seh-msvcrt-rt_v14-rev1.7z"
          $archive = "$env:RUNNER_TEMP\mingw.7z"
          $dest = "C:\mingw-dist"
          Invoke-WebRequest -Uri $url -OutFile $archive
          7z x $archive "-o$dest" -y | Out-Null
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            $ninjaZip = "$env:RUNNER_TEMP\ninja.zip"
            Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip" -OutFile $ninjaZip
            Expand-Archive -Path $ninjaZip -DestinationPath "$dest\mingw64\bin" -Force
          }
          "$dest\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure & Build (MSVC)
        if: matrix.toolchain == 'msvc'
        shell: pwsh
        run: |
          cmake -B build-msvc -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl.exe
          cmake --build build-msvc

      - name: Configure & Build (MinGW)
        if: matrix.toolchain == 'mingw'
        shell: pwsh
        run: |
          cmake -B build-mingw -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=C:/mingw-dist/mingw64/bin/gcc.exe `
            -DCMAKE_AR=C:/mingw-dist/mingw64/bin/gcc-ar.exe `
            -DCMAKE_RANLIB=C:/mingw-dist/mingw64/bin/gcc-ranlib.exe
          cmake --build build-mingw

      - name: Run Tests
        shell: pwsh
        run: |
          ctest --test-dir build-${{ matrix.toolchain }} --output-on-failure

      - name: Verify Demo Standalone Imports
        shell: pwsh
        run: |
          $demos = Get-ChildItem "build-${{ matrix.toolchain }}\demo\*.exe"
          $demos | Format-Table Name, Length -AutoSize
          if ("${{ matrix.toolchain }}" -eq "mingw") {
            $imports = & C:\mingw-dist\mingw64\bin\objdump.exe -p $demos.FullName | Select-String "DLL Name"
          } else {
            $imports = & dumpbin /imports $demos.FullName | Select-String "\.dll"
          }
          $imports
          if ($imports | Select-String -Pattern "monac\.dll|monac_lsp\.dll|libgcc|libwinpthread|vcruntime|shcore" -CaseSensitive:$false) {
            Write-Error "Unexpected non-Win7 or non-static DLL dependency detected in demo binaries!"
            exit 1
          }

      - name: Upload Demo Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: monac-demo-${{ matrix.toolchain }}
          path: build-${{ matrix.toolchain }}/demo/*.exe
          if-no-files-found: error
